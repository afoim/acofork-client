# Workflow-only repository. Application source stays private; never upload checkout or source maps.
name: App shell - all platforms
on:
  workflow_dispatch:
    inputs:
      verify_android:
        description: 'Run optional Android emulator verification before publishing'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish verified signed installers to the stable channel'
        type: boolean
        default: false
      publish_run:
        description: 'Publish existing installer artifacts from this run (manual device testing)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  APP_BUILD_OFFSET: '1000'
concurrency:
  group: app-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    if: inputs.publish_run == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set monotonic native build number
        shell: bash
        run: echo "APP_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: node --test tests/shell/*.test.mjs
      - run: node --test tests/business-api-origins.test.mjs tests/media-url-security.test.mjs tests/media-token-race.test.mjs
      - run: node scripts/shell/check-types.mjs
      - run: node scripts/shell/build-frontend.mjs
        env:
          RESOURCE_VERSION: ci-${{ github.run_number }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with: { name: app-frontend, path: shell/bundle, retention-days: 14, overwrite: true }
  windows:
    needs: frontend
    runs-on: windows-latest
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set monotonic native build number
        shell: bash
        run: echo "APP_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: { name: app-frontend, path: shell/bundle }
      - run: npm ci --prefix shell
      - run: npm run tauri --prefix shell -- icon ../public/brand/af-icon-1024.png
      - run: cargo test --manifest-path shell/src-tauri/Cargo.toml
      - run: npm run tauri --prefix shell -- build --bundles nsis
      - name: Launch WebView and verify native HTTP bridge
        shell: pwsh
        run: |
          $env:ACOFORK_SHELL_SMOKE = '1'
          $env:ACOFORK_SHELL_RESTART_SMOKE = '1'
          $app = Start-Process -FilePath (Resolve-Path 'shell/src-tauri/target/release/acofork-shell.exe') -WindowStyle Hidden -PassThru
          if (!$app.WaitForExit(90000)) { Stop-Process -Id $app.Id; throw 'WebView startup did not acknowledge readiness within 90 seconds' }
          if ($app.ExitCode -ne 0) { throw "APP smoke test failed: $($app.ExitCode)" }
          $restartDeadline = (Get-Date).AddSeconds(90)
          while (!(Test-Path -LiteralPath smoke-report.json) -and (Get-Date) -lt $restartDeadline) { Start-Sleep -Milliseconds 250 }
          if (!(Test-Path -LiteralPath smoke-report.json)) { throw 'Restarted APP did not report readiness' }
          $report = Get-Content smoke-report.json -Raw | ConvertFrom-Json
          if (!$report.rendered -or !$report.nativeHttp -or !$report.restarted -or !$report.nativeDownload) { throw 'Incomplete native runtime/restart/download report' }
          if ((Split-Path -Leaf (Split-Path -Parent $report.downloadPath)) -ne 'AcoFork') { throw 'Download escaped the AcoFork folder' }
          if ((Get-Content -LiteralPath $report.downloadPath -Raw) -ne 'AcoFork native download verification') { throw 'Saved file bytes differ' }
          Get-Content smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: Windows-runtime-report, path: smoke-report.json, if-no-files-found: warn, overwrite: true }
      - uses: actions/upload-artifact@v4
        with:
          name: AcoFork-Windows
          overwrite: true
          path: shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
  android:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set monotonic native build number
        shell: bash
        run: echo "APP_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: sdkmanager 'ndk;27.2.12479018'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,x86_64-linux-android' }
      - uses: actions/download-artifact@v4
        with: { name: app-frontend, path: shell/bundle }
      - run: npm ci --prefix shell
      - run: npm run tauri --prefix shell -- android init --ci
      - run: npm run tauri --prefix shell -- icon ../public/brand/af-icon-1024.png
      - run: node scripts/shell/configure-android.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.APP_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APP_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APP_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APP_ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ env.APP_BUILD_NUMBER }}
      - run: npm run tauri --prefix shell -- android build --apk --target aarch64 --ci
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APP_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APP_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APP_ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: AcoFork-Android-arm64
          overwrite: true
          path: shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build isolated Android emulator debug APK
        if: inputs.verify_android == true
        run: npm run tauri --prefix shell -- android build --apk --target x86_64 --debug --ci
      - name: Enable emulator acceleration
        if: inputs.verify_android == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android status bar and public Downloads storage
        if: inputs.verify_android == true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/shell/android-runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: Android-runtime-report, path: artifacts/android-runtime, if-no-files-found: warn, overwrite: true }
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage', name: Linux-x64 }
          - { os: macos-latest, target: universal-apple-darwin, bundles: dmg, name: macOS-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set monotonic native build number
        shell: bash
        run: echo "APP_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: actions/download-artifact@v4
        with: { name: app-frontend, path: shell/bundle }
      - run: npm ci --prefix shell
      - run: npm run tauri --prefix shell -- icon ../public/brand/af-icon-1024.png
      - run: cargo test --manifest-path shell/src-tauri/Cargo.toml
      - run: npm run tauri --prefix shell -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        env:
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: AcoFork-${{ matrix.name }}
          overwrite: true
          path: |
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
  ios:
    needs: frontend
    runs-on: macos-latest
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set monotonic native build number
        shell: bash
        run: echo "APP_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: actions/download-artifact@v4
        with: { name: app-frontend, path: shell/bundle }
      - run: npm ci --prefix shell
      - run: npm run tauri --prefix shell -- ios init --ci
      - run: npm run tauri --prefix shell -- icon ../public/brand/af-icon-1024.png
      - run: npm run tauri --prefix shell -- ios build --target aarch64 --ci --no-sign --build-number ${{ env.APP_BUILD_NUMBER }}
      - name: Verify unsigned device IPA
        run: |
          python3 scripts/shell/verify-ipa.py shell/src-tauri/gen/apple/build
      - uses: actions/upload-artifact@v4
        with:
          name: AcoFork-iOS-arm64-unsigned
          overwrite: true
          path: shell/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [windows, android, desktop, ios]
    if: always() && inputs.publish == true && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'afoim/acofork-client' && (inputs.publish_run != '' || (needs.windows.result == 'success' && needs.android.result == 'success' && needs.desktop.result == 'success' && needs.ios.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private client source
        uses: actions/checkout@v4
        with:
          repository: afoim/af_preact_spa
          ref: codex/webview-shell
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Preserve the verified artifact build identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
        run: |
          number="$GITHUB_RUN_NUMBER"
          attempt="$GITHUB_RUN_ATTEMPT"
          if [ -n "$PUBLISH_RUN" ]; then
            [[ "$PUBLISH_RUN" =~ ^[0-9]+$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN" > "$RUNNER_TEMP/source-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/app-shell.yml" and .head_repository.full_name == $repo' "$RUNNER_TEMP/source-run.json" > /dev/null
            number=$(jq -r .run_number "$RUNNER_TEMP/source-run.json")
            attempt=$(jq -r .run_attempt "$RUNNER_TEMP/source-run.json")
          fi
          echo "APP_BUILD_NUMBER=$((1000 + number))" >> "$GITHUB_ENV"
          echo "APP_BUILD_ATTEMPT=$attempt" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/download-artifact@v4
        with:
          pattern: 'AcoFork-*'
          path: packages
          run-id: ${{ inputs.publish_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Collect installers and checksums
        run: |
          mkdir release
          find packages -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.ipa' \) -exec cp --no-clobber {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish public CNB installers and verify anonymous downloads
        run: node scripts/shell/publish-installers.mjs release
        env:
          CNB_RELEASE_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN }}
          RESOURCE_SIGNING_PRIVATE_KEY: ${{ secrets.RESOURCE_SIGNING_PRIVATE_KEY }}
